<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7eed00"/>
      <stop offset="100%" stop-color="#5eb300"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="64" height="64" rx="16" fill="url(#gbGrad)"/>
  <!-- Highlight Rim -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
  <!-- Speed underline accent -->
  <rect x="13" y="48" width="38" height="3.5" rx="1.75" fill="#131b26"/>
  <!-- GB Monogram -->
  <text x="32" y="40"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="30"
        font-weight="900"
        font-style="italic"
        letter-spacing="-1"
        text-anchor="middle"
        fill="#131b26"
        filter="url(#shadow)">GB</text>
</svg>
