services:
  - type: web
    name: gobus-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gobus-db
          property: connectionString
      - key: FRONTEND_URL
        value: http://localhost:5173

databases:
  - name: gobus-db
    databaseName: bus_booking_db
    user: bus_admin
    plan: free
